<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — OddsGPT</title><style>body{background:#000;color:#fff;font-family:Arial;margin:0;padding:16px} .top{display:flex;align-items:center;gap:10px} .eye{width:40px;height:40px;background:#22e06a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-size:22px} .card{background:#0a0a0a;border:1px solid #222;border-radius:18px;padding:16px;margin-top:14px} .btn{background:#22e06a;color:#000;border:0;border-radius:10px;padding:12px 14px;font-weight:800;width:100%} .input{background:#000;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;width:100%;box-sizing:border-box} .hide{display:none}</style></head><body>
<div class="top"><div class="eye">👁️</div><b>DR — Admin Log</b><span id="adminTime" style="margin-left:auto;color:#22e06a;font-weight:700"></span></div>
<div id="loginBox" class="card"><h3 style="margin:0">Enter Admin Log</h3><p style="color:#aaa" id="adminDateLine">Secure access</p>
<input class="input" id="email" placeholder="Email"><div style="position:relative;margin-top:10px"><input class="input" id="pw" type="password" placeholder="Password" style="padding-right:44px"><button type="button" onclick="let e=document.getElementById('pw'); e.type=e.type==='password'?'text':'password'" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#aaa;font-size:20px;cursor:pointer">👁️</button></div><button class="btn" style="margin-top:14px" onclick="login()">Enter Log</button><p id="msg" style="color:#f55"></p></div>
<div id="dash" class="hide"><div class="card"><b>Dashboard</b><p>Users: <b id="uCount">0</b> | Subs: <b id="sCount">0</b></p></div><div class="card"><b>Manual Grant</b><input class="input" id="gEmail" placeholder="User email"><input class="input" id="gPlan" placeholder="Plan" style="margin-top:8px"><input class="input" id="gId" placeholder="Payment ID" style="margin-top:8px"><button class="btn" style="margin-top:10px" onclick="grant()">Grant</button></div></div>
<script>
const API='https://oddsgpt-backend.vercel.app';
function tick(){let d=new Date(); let opts={weekday:'short',day:'2-digit',month:'short',year:'numeric'}; let date=d.toLocaleDateString('en-GB',opts); let time=d.toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit',hour12:true}); document.getElementById('adminTime').textContent=date+' — '+time+' WAT'; document.getElementById('adminDateLine').textContent='Secure access — '+date+' — '+time+' WAT — DR';}
setInterval(tick,1000); tick();
async function login(){let email=document.getElementById('email').value.trim(); let pw=document.getElementById('pw').value; if(email.toLowerCase()!=='drpillz4ever@gmail.com'){document.getElementById('msg').textContent='Access denied'; return;} try{let r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})}); let j=await r.json(); if(!r.ok){document.getElementById('msg').textContent=j.error||'Login failed'; return;} localStorage.setItem('admin_token',j.token); document.getElementById('loginBox').classList.add('hide'); document.getElementById('dash').classList.remove('hide');}catch(e){document.getElementById('msg').textContent='Network error';}}
async function grant(){let token=localStorage.getItem('admin_token'); let r=await fetch(API+'/api/admin/grant',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({email:document.getElementById('gEmail').value,plan:document.getElementById('gPlan').value,payment_id:document.getElementById('gId').value})}); let j=await r.json(); alert(j.message||j.error);}
</script></body></html>
